<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgAs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20293B"/>
      <stop offset="1" stop-color="#0E1220"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bgAs)"/>

  <!-- Variante para 16/32 px: tres barras gruesas en vez de cinco finas.
       A ese tamaño las cinco originales se funden en un bloque gris. -->
  <g>
    <rect x="146" y="264" width="420" height="86" rx="43" fill="#6B7793"/>
    <rect x="146" y="392" width="330" height="86" rx="43" fill="#57C98A"/>
    <rect x="146" y="520" width="250" height="86" rx="43" fill="#E4685F"/>
  </g>

  <!-- Lupa más grande y con más aire, para que sobreviva al downscale -->
  <g>
    <circle cx="646" cy="586" r="268" fill="#0E1220" opacity="0.62"/>
    <circle cx="646" cy="586" r="204" fill="none" stroke="#8FBEFF" stroke-width="80"/>
    <rect x="778" y="718" width="80" height="210" rx="40"
          fill="#8FBEFF" transform="rotate(-45 818 823)"/>
  </g>
</svg>
